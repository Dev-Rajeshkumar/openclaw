apiVersion: v1
kind: Secret
metadata:
  name: cms-secrets
  namespace: cms-platform
type: Opaque
stringData:
  # PostgreSQL
  DATABASE_HOST: "your-postgres-host"
  DATABASE_NAME: "cms_db"
  DATABASE_USERNAME: "cms_user"
  DATABASE_PASSWORD: "change-me-in-production"
  
  # Strapi
  APP_KEYS: "key1-change-me,key2-change-me"
  API_TOKEN_SALT: "change-me"
  ADMIN_JWT_SECRET: "change-me"
  JWT_SECRET: "change-me"
  TRANSFER_TOKEN_SALT: "change-me"
  
  # Meilisearch
  MEILI_API_KEY: "change-me"
  
  # MinIO
  MINIO_ACCESS_KEY: "change-me"
  MINIO_SECRET_KEY: "change-me"
  
  # SMTP
  SMTP_USERNAME: "change-me"
  SMTP_PASSWORD: "change-me"
  
  # AI
  AI_API_KEY: "your-openrouter-key"
  AI_MODEL: "meta-llama/llama-3.1-70b"
