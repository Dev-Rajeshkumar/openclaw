# Promtail Configuration — Log Collection Agent
# Collects logs from all CMS services and ships to Loki
# Docs: https://grafana.com/docs/loki/latest/send-data/promtail/

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml
  sync_period: 10s

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    tenant_id: cms

scrape_configs:
  # ── API Server Logs ────────────────────────────────────────
  - job_name: cms-api
    static_configs:
      - targets:
          - localhost
        labels:
          service: cms-api
          level: info
          __path__: /var/log/api/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            timestamp: time
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: msg

  # ── Web Frontend Logs ──────────────────────────────────────
  - job_name: cms-web
    static_configs:
      - targets:
          - localhost
        labels:
          service: cms-web
          level: info
          __path__: /var/log/web/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: message
            timestamp: time
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: msg

  # ── Nginx Access Logs ──────────────────────────────────────
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          service: nginx
          level: access
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>[\d.]+) - (?P<remote_user>\S+) \[(?P<time>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      - labels:
          method:
          status:
      - timestamp:
          source: time
          format: 02/Jan/2006:15:04:05 -0700
      - output:
          source: path

  # ── Nginx Error Logs ───────────────────────────────────────
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          service: nginx
          level: error
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+).*(?P<msg>.*)'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: 2006/01/02 15:04:05
      - output:
          source: msg

  # ── PostgreSQL Logs ────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets:
          - localhost
        labels:
          service: postgres
          level: info
          __path__: /var/log/postgresql/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \S+ \[(?P<pid>\d+)\] (?P<level>\w+): (?P<msg>.*)'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: 2006-01-02 15:04:05
      - output:
          source: msg

  # ── Redis Logs ─────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets:
          - localhost
        labels:
          service: redis
          level: info
          __path__: /var/log/redis/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<pid>\d+):(?P<role>\w+) (?P<timestamp>\d{2} \w+ \d{2}:\d{2}:\d{2}\.\d+) (?P<level>[#*]) (?P<msg>.*)'
      - labels:
          level:
          role:
      - timestamp:
          source: timestamp
          format: 02 Jan 15:04:05.000
      - output:
          source: msg

  # ── Docker Container Logs ──────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=cms"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - labels:
          stream:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output

  # ── System Journal (systemd) ───────────────────────────────
  - job_name: systemd
    journal:
      max_age: 12h
      labels:
        service: systemd
        level: info
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal_priority']
        target_label: 'level'
