# CMS Platform — Docker Compose (Local Development)
# 100% free, self-contained, one-command startup
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f api    # Follow Strapi logs
#   docker compose logs -f web    # Follow Next.js logs
#   docker compose down           # Stop all services
#   docker compose down -v        # Stop + remove volumes (reset data)

version: "3.9"

services:
  # ── PostgreSQL (Primary Database) ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms_db
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d cms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  # ── Redis (Cache + Sessions + BullMQ Queue) ────────────────
  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  # ── Meilisearch (Full-Text Search Engine) ──────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: cms-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: cms_master_key_change_in_production
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  # ── MinIO (S3-Compatible Object Storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: cms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  # ── MinIO Bucket Initializer ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: cms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/cms-media --ignore-existing;
      mc anonymous set download local/cms-media;
      exit 0;
      "
    networks:
      - cms-network

  # ── Strapi v5 (Headless CMS API) ───────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cms-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: cms_db
      DATABASE_USERNAME: cms_user
      DATABASE_PASSWORD: cms_password
      DATABASE_SSL: "false"
      APP_KEYS: "toBeModified1,toBeModified2"
      API_TOKEN_SALT: toBeModified
      ADMIN_JWT_SECRET: toBeModified
      JWT_SECRET: toBeModified
      TRANSFER_TOKEN_SALT: toBeModified
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: cms_master_key_change_in_production
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: cms-media
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      DEFAULT_FROM_EMAIL: noreply@cms.local
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:1337
      AI_PROVIDER: openrouter
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: meta-llama/llama-3.1-70b
    ports:
      - "1337:1337"
    volumes:
      - ./api/src:/app/src
      - ./api/config:/app/config
      - ./api/scripts:/app/scripts
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cms-network

  # ── Next.js (Frontend) ─────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cms-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:1337
      NEXT_PUBLIC_STRAPI_URL: http://localhost:1337
      API_URL_INTERNAL: http://api:1337
      DATABASE_URL: postgresql://cms_user:cms_password@postgres:5432/cms_db
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - cms-network

  # ── Mailpit (SMTP Catcher for Dev) ─────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: cms-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP port
      - "8025:8025"   # Web UI
    networks:
      - cms-network

  # ── Redis Commander (Redis Web UI) ─────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cms-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cms-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  minio_data:
    driver: local
  strapi_uploads:
    driver: local

networks:
  cms-network:
    driver: bridge
    name: cms-network
