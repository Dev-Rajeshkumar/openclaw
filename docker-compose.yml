# CMS Platform — Docker Compose (Local Development)
# 100% free, self-contained, one-command startup
#
# Usage:
#   cp .env.example .env   # First time only
#   docker compose up -d   # Start all services
#
# All services read from the root .env file.

version: "3.9"

# All services inherit environment from root .env
x-common-env: &common-env
  env_file:
    - .env

services:
  # ── PostgreSQL (Primary Database) ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    restart: unless-stopped
    <<: *common-env
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cms_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-cms_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cms_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-cms_user} -d ${DATABASE_NAME:-cms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  # ── Redis (Cache + Sessions + BullMQ Queue) ────────────────
  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    <<: *common-env
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  # ── Meilisearch (Full-Text Search Engine) ──────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: cms-meilisearch
    restart: unless-stopped
    <<: *common-env
    environment:
      MEILI_MASTER_KEY: ${MEILI_API_KEY:-masterKey123}
      MEILI_ENV: ${NODE_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  # ── MinIO (S3-Compatible Object Storage) ───────────────────
  minio:
    image: minio/minio:latest
    container_name: cms-minio
    restart: unless-stopped
    <<: *common-env
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  # ── MinIO Bucket Initializer ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: cms-minio-init
    <<: *common-env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123};
      mc mb local/${MINIO_BUCKET:-cms-media} --ignore-existing;
      mc anonymous set download local/${MINIO_BUCKET:-cms-media};
      exit 0;
      "
    networks:
      - cms-network

  # ── Strapi v5 (Headless CMS API) ───────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: cms-api
    restart: unless-stopped
    <<: *common-env
    ports:
      - "1337:1337"
    volumes:
      - ./api/src:/app/src
      - ./api/config:/app/config
      - ./api/scripts:/app/scripts
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - cms-network

  # ── Next.js (Frontend) ─────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: cms-web
    restart: unless-stopped
    <<: *common-env
    ports:
      - "3000:3000"
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - cms-network

  # ── Mailpit (SMTP Catcher for Dev) ─────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: cms-mailpit
    restart: unless-stopped
    <<: *common-env
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - cms-network

  # ── Redis Commander (Redis Web UI) ─────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cms-redis-ui
    restart: unless-stopped
    <<: *common-env
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cms-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  minio_data:
    driver: local
  strapi_uploads:
    driver: local

networks:
  cms-network:
    driver: bridge
    name: cms-network
