# Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:
  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis:
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  meilisearch:
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_API_KEY}
      MEILI_ENV: production
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  minio:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  api:
    restart: always
    environment:
      NODE_ENV: production
    build:
      target: production
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  web:
    restart: always
    environment:
      NODE_ENV: production
    build:
      target: production
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Remove development-only services
  mailpit:
    profiles: ["disabled"]

  redis-commander:
    profiles: ["disabled"]

  minio-init:
    restart: "no"
